# Continuous integration: the same checks a contributor runs locally (README "Tests").
# Runs on every push and pull request; deploys nothing and needs no secrets. The model
# provider is never called: tests strip provider keys and the browser journeys use a scripted
# model (E2E_FAKE_LLM).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, full test suite incl. ML)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --cov=app --cov-report=term

  backend-runtime:
    name: Backend tests without the ML stack (what Render runs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-group ml
      - run: uv run --no-sync pytest -q --ignore=tests/ml

  frontend:
    name: Frontend (lint, types, API contract, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_NO_SYNC: "1" # the API-types script runs the backend; it was synced below without ML
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-group ml
        working-directory: backend
      - uses: pnpm/action-setup@v4 # version from "packageManager" in the root package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
      # --ignore-scripts skips the root postinstall (a full `uv sync`); the backend was synced above.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm exec tsc --noEmit
        working-directory: frontend
      - run: pnpm check:api
        working-directory: frontend
      - run: pnpm exec vitest run --coverage
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  e2e:
    name: Browser journeys (desktop and phone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-group ml
        working-directory: backend
      - uses: pnpm/action-setup@v4 # version from "packageManager" in the root package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
      # --ignore-scripts skips the root postinstall (a full `uv sync`); the backend was synced above.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  secrets:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
