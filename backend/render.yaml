# Render blueprint for the API. Nothing here is deployed until the author applies it.
# It lives in backend/ so the API deploys from that folder alone (D-74): when creating the
# Blueprint, set its file path to backend/render.yaml. rootDir below is relative to the repo root.
# Secrets are never written here: `sync: false` makes Render ask for the value in its dashboard.
# Walkthrough: docs/deployment.md

services:
  - type: web
    name: paysense-v3-api # not "paysense-api": that name belongs to the v2 (FYP) service
    runtime: python # Render's native Python; version from backend/.python-version
    rootDir: backend
    # Server packages only: the ml group (torch, prophet, the tree libraries) is for training.
    buildCommand: pip install uv && uv sync --frozen --no-default-groups
    # One worker: the login rate limiter keeps its state in the process. FORWARDED_ALLOW_IPS has no
    # default: unset, every client would share the proxy's limiter bucket, so the start fails instead.
    # --limit-concurrency sheds load with a 503 instead of exhausting memory.
    startCommand: >-
      .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
      --forwarded-allow-ips "${FORWARDED_ALLOW_IPS:?set FORWARDED_ALLOW_IPS to the proxy address range}"
      --limit-concurrency 40 --timeout-keep-alive 5
    region: singapore # next to the Supabase project (Singapore)
    plan: free # 512 MB; the served stack measured about 150 MB (see the guide)
    healthCheckPath: /api/health
    autoDeploy: false # deploys happen when the author chooses
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12" # logout revokes every session (D-49); the TTL bounds a token nobody logs out
      - key: CORS_ORIGINS
        sync: false # the Vercel URL, e.g. https://paysense.vercel.app, no trailing slash
      - key: FORWARDED_ALLOW_IPS
        sync: false # the platform's proxy range, never "*" (see the guide)
      # The assistant (D-53). Without a key it runs in guided mode (no model): safe to deploy first.
      - key: LLM_PROVIDER
        value: groq # D-70; or gemini / anthropic with the matching key; "none" switches the model off
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASSISTANT_GLOBAL_DAILY_TOKENS
        value: "3000000" # the cap across all users; never deploy a public URL without it
      - key: ASSISTANT_USER_DAILY_TOKENS
        value: "200000"
      - key: ASSISTANT_DAILY_REQUESTS
        value: "300"
      - key: DAILY_WRITE_QUOTA
        value: "300"
      # Sign in with Google (D-69): off unless all three are set. API_PUBLIC_URL is this service's URL.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        sync: false
