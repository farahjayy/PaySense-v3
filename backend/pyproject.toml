[project]
name = "paysense-backend"
version = "0.1.0"
description = "PaySense v2 API: financial health forecasting and BNPL risk classification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.6",
    "supabase>=2.32",
    "pyjwt>=2.15",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
    "onnxruntime>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "httpx>=0.28",
    "ruff>=0.9",
    "httpx2>=2.13.1",
]
ml = [
    "defusedxml>=0.7.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "onnx>=1.23.2",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "prophet>=1.5.0",
    "pymysql>=1.2.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsforecast>=2.0.1",
    "torch>=2.14.1",
    "xgboost>=3.4.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# `uv run` installs the ml group too, so offline tooling and its tests work without flags.
default-groups = ["dev", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits the real Supabase project (needs SUPABASE_URL)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.coverage.run]
source = ["app"]
